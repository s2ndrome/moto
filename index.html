<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RIDER CARD</title>
<style id="cardStyle">
  .card { padding: 12px; box-sizing: border-box; }
  .card[data-bg-type="checker"] {
    --bg-color: var(--point-color);
    background: linear-gradient(45deg, var(--bg-color) 25%, transparent 25%, transparent 75%, var(--bg-color) 75%, var(--bg-color)),
                linear-gradient(45deg, var(--bg-color) 25%, #fff 25%, #fff 75%, var(--bg-color) 75%, var(--bg-color));
    background-size: 22px 22px;
    background-position: 0 0, 11px 11px;
  }
  .card[data-bg-type="gradient"] {
    --bg-color-1: var(--point-color);
    --bg-color-2: #4b5563;
    background: linear-gradient(135deg, var(--bg-color-1), var(--bg-color-2));
  }
  .card[data-bg-type="image"] {
    background-color: #e5e7eb;
    background-image: var(--bg-image, none);
    background-size: cover;
    background-position: center;
  }
  .card-inner { background: #fff; position: relative; overflow: hidden; padding: 14px; box-sizing: border-box; }
  .card-watermark {
    position: absolute; top: 48px; right: 18px; font-size: 48px; font-weight: 900;
    letter-spacing: .08em; color: var(--point-color); opacity: .05; line-height: 1; z-index: 0;
  }
  .card-content { position: relative; z-index: 2; }

  .card-photowrap { position: relative; width: 100%; background: #fff; box-sizing: border-box; margin-bottom: 18px; padding: 4px 4px 8px; overflow: visible; }
  .card-sticker { position: absolute; height: auto; object-fit: contain; border: 0; z-index: 8; filter: url(#stickerOutline) drop-shadow(0 6px 10px rgba(0,0,0,.2)); touch-action: none; }
  .card-frame {
    width: 100%; background: #fff; border: 1px solid var(--point-color); padding: 10px 10px 16px; box-sizing: border-box;
    box-shadow: 6px 6px 0 rgba(17,17,17,.12); position: relative; z-index: 4;
  }
  .card-photo { width: 100%; aspect-ratio: 3/4; background: #e5e7eb; border: 1px solid var(--point-color); overflow: hidden; position: relative; box-sizing: border-box; }
  .card-photo img { display: block; width: 100%; height: 100%; object-fit: cover; border: 0; }
  .card-photo-shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(17,17,17,.10) 55%, rgba(17,17,17,.72) 100%); pointer-events: none; }
  .card-photo-label { position: absolute; left: 16px; bottom: 16px; font-size: 44px; font-weight: 900; letter-spacing: .12em; color: #fff; line-height: 1; }
  .card-namebox { margin-top: 14px; text-align: center; }
  .card-namebox .name { font-size: 20px; font-weight: 900; letter-spacing: .08em; color: var(--point-color); }
  .card-namebox .role { margin-top: 4px; font-size: 12px; line-height: 1.6; color: #4b5563; }

  .card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-bottom: 16px; color: #222; }
  .card-grid .box { --cell-color: var(--point-color); position: relative; padding: 12px 10px; box-sizing: border-box; min-height: 74px; display: flex; flex-direction: column; justify-content: center; }
  .card-grid .box .label { font-size: 9px; font-weight: 900; letter-spacing: .16em; margin-bottom: 6px; }
  .card-grid .box .value { font-size: 15px; font-weight: 900; line-height: 1.35; }
  .card-grid .box.dark { background: var(--cell-color); }
  .card-grid .box.dark .label { color: #d1d5db; }
  .card-grid .box.dark .value { color: #fff; }
  .card-grid .box.light { background: #f3f4f6; border-left: 5px solid var(--cell-color); }
  .card-grid .box.light .label { color: #6b7280; }
  .card-grid .box.light .value { color: var(--cell-color); }

  .card-section { --cell-color: var(--point-color); position: relative; background: #fff; border: 1px solid var(--cell-color); padding: 14px 13px; margin-bottom: 10px; box-sizing: border-box; box-shadow: 4px 4px 0 rgba(17,17,17,.10); }
  .card-section .title { font-size: 12px; font-weight: 900; letter-spacing: .08em; margin-bottom: 6px; color: var(--cell-color); }
  .card-section .body { font-size: 13px; line-height: 1.75; color: #222; }
  .card-section .divider { height: 1px; border-top: 1px dashed #d4d4d8; margin: 10px 0; }

  .card-offtrack .title { margin-bottom: 9px; }
  .card-offtrack .row { border-top: 1px dashed #d4d4d8; padding: 8px 0; font-size: 12px; line-height: 1.7; color: #222; }
  .card-offtrack .row:last-child { border-bottom: 1px dashed #d4d4d8; }
  .card-offtrack .row .key { font-weight: 900; letter-spacing: .08em; margin-right: 6px; }
</style>
<style>
  :root { --point-color: #111111; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #ececec; font-family: -apple-system, "Noto Sans KR", sans-serif; }

  .app-bar {
    position: sticky; top: 0; z-index: 50; display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; background: rgba(255,255,255,.9); backdrop-filter: blur(6px);
    border-bottom: 1px solid #ddd; flex-wrap: wrap;
  }
  .app-bar .app-title { font-weight: 900; font-size: 13px; letter-spacing: .06em; color: #111; margin-right: auto; }
  .app-bar label { font-size: 12px; color: #444; display: flex; align-items: center; gap: 6px; }
  .app-bar input[type="color"] { width: 30px; height: 30px; border: 1px solid #ccc; border-radius: 6px; padding: 0; background: none; cursor: pointer; }
  .app-bar button {
    font-size: 12px; font-weight: 700; padding: 7px 12px; border-radius: 6px; border: 1px solid #ccc;
    background: #fff; color: #222; cursor: pointer;
  }
  .app-bar button:hover { background: #f2f2f2; }
  .app-bar .save-status { font-size: 11px; color: #16a34a; opacity: 0; transition: opacity .3s; }
  .app-bar .save-status.show { opacity: 1; }
  .app-hint { max-width: 420px; margin: 10px auto 0; padding: 0 12px; font-size: 12px; line-height: 1.6; color: #666; text-align: center; }

  .stage { display: flex; justify-content: center; padding: 16px 12px 80px; }
  .card-outer { width: 100%; max-width: 420px; }

  /* ---- 편집 가능 요소 표시 ---- */
  [contenteditable="true"] { outline: none; border-radius: 3px; cursor: text; }
  [contenteditable="true"]:hover { box-shadow: 0 0 0 2px rgba(59,130,246,.35); }
  [contenteditable="true"]:focus { box-shadow: 0 0 0 2px #3b82f6; background: rgba(59,130,246,.06); }
  [contenteditable="true"]:empty::before { content: attr(data-placeholder); color: #9ca3af; font-weight: 400; pointer-events: none; }

  .card-photo img, .card-sticker { cursor: pointer; }
  .card-sticker:hover { outline: 2px dashed rgba(59,130,246,.6); outline-offset: 2px; }
  .card-sticker.dragging { outline: 2px solid #3b82f6; cursor: grabbing; opacity: .9; }

  /* ---- 칸별 색상 지정 점 ---- */
  .cell-color-picker { position: absolute; top: 6px; right: 6px; z-index: 6; display: block; width: 15px; height: 15px; cursor: pointer; }
  .cell-color-picker input[type="color"] { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; border: 0; padding: 0; margin: 0; cursor: pointer; }
  .cell-color-dot {
    display: block; width: 100%; height: 100%; border-radius: 50%; box-sizing: border-box;
    background: var(--cell-color); border: 1.5px solid rgba(255,255,255,.9);
    box-shadow: 0 0 0 1px rgba(0,0,0,.3); pointer-events: none;
  }
  .cell-color-picker:hover .cell-color-dot { box-shadow: 0 0 0 1px rgba(0,0,0,.3), 0 0 0 3px rgba(59,130,246,.35); }

  /* ---- 하단 이미지 편집 패널 ---- */
  .img-panel {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 100;
    background: #fff; border-top: 1px solid #ddd; box-shadow: 0 -6px 20px rgba(0,0,0,.12);
    padding: 14px 16px 18px; transform: translateY(110%); transition: transform .25s ease;
    max-height: 60vh; overflow-y: auto;
  }
  .img-panel.open { transform: translateY(0); }
  .img-panel-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .img-panel-head span { font-size: 13px; font-weight: 800; color: #111; }
  .img-panel-head button { border: none; background: none; font-size: 18px; line-height: 1; cursor: pointer; color: #888; }
  .img-panel-row { margin-bottom: 10px; }
  .img-panel-row label { display: block; font-size: 11px; color: #666; margin-bottom: 4px; }
  .img-panel-row input[type="text"] { width: 100%; padding: 8px 10px; font-size: 13px; border: 1px solid #ccc; border-radius: 6px; }
  .img-panel-row select { width: 100%; padding: 8px 10px; font-size: 13px; border: 1px solid #ccc; border-radius: 6px; background: #fff; color: #222; }
  .img-panel-row input[type="color"] { width: 40px; height: 30px; border: 1px solid #ccc; border-radius: 6px; padding: 0; background: none; cursor: pointer; }
  .img-panel-row input[type="range"] { width: 100%; }
  .img-panel-row .range-val { font-size: 11px; color: #888; }
  .img-panel-row input[type="file"] { font-size: 12px; }
  .img-panel-drag-hint { font-size: 11px; color: #999; margin-top: -2px; margin-bottom: 10px; }

  @media (prefers-color-scheme: dark) {
    html, body { background: #1c1c1e; }
    .app-bar { background: rgba(30,30,32,.9); border-bottom-color: #333; }
    .app-bar .app-title { color: #eee; }
    .app-bar label { color: #ccc; }
    .app-bar button { background: #2a2a2c; color: #eee; border-color: #444; }
    .app-bar button:hover { background: #333; }
    .app-hint { color: #999; }
    .img-panel { background: #2a2a2c; border-top-color: #444; }
    .img-panel-head span { color: #eee; }
    .img-panel-row label { color: #aaa; }
    .img-panel-row input[type="text"] { background: #1c1c1e; border-color: #444; color: #eee; }
    .img-panel-row select { background: #1c1c1e; border-color: #444; color: #eee; }
  }
</style>
</head>
<body>

<svg width="0" height="0" style="position: absolute; overflow: hidden;" aria-hidden="true">
  <defs>
    <filter id="stickerOutline" x="-30%" y="-30%" width="160%" height="160%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="4" result="dilated"/>
      <feFlood flood-color="#ffffff" result="white"/>
      <feComposite in="white" in2="dilated" operator="in" result="outline"/>
      <feMerge>
        <feMergeNode in="outline"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
</svg>

<div class="app-bar">
  <span class="app-title">RIDER CARD</span>
  <label>포인트 색상 <input type="color" id="pointColorInput" value="#111111"></label>
  <button type="button" id="bgOpenBtn">배경</button>
  <button type="button" id="copyBtn">HTML 복사</button>
  <button type="button" id="saveImageBtn">이미지 저장</button>
  <button type="button" id="resetBtn">초기화</button>
  <span class="save-status" id="saveStatus">저장됨</span>
</div>
<p class="app-hint">글자는 클릭해서 바로 수정하세요. 사진을 클릭하면 이미지를 바꿀 수 있고, 스티커는 드래그해서 위치를 옮길 수 있어요. 수정 내용은 이 브라우저에 자동 저장됩니다.</p>

            </div>
            <div class="box light">
              <label class="cell-color-picker"><input type="color" class="cell-color-input" value="#111111"><span class="cell-color-dot"></span></label>

<!-- 이미지 편집 패널 (사진/스티커 클릭 시 열림) -->
<div class="img-panel" id="imgPanel">
  <div class="img-panel-head">
    <span id="imgPanelTitle">이미지 편집</span>
    <button type="button" id="imgPanelClose" aria-label="닫기">✕</button>
  </div>
  <div class="img-panel-row">
    <label>이미지 주소 (URL)</label>
    <input type="text" id="imgUrlInput" placeholder="https://...">
  </div>
  <div class="img-panel-row">
    <label>또는 내 사진 올리기</label>
    <input type="file" id="imgFileInput" accept="image/*">
  </div>
  <div class="img-panel-row" id="stickerControls" hidden>
    <div class="img-panel-drag-hint">스티커는 카드 위에서 직접 드래그해도 위치가 바뀌어요.</div>
    <label>크기 <span class="range-val" id="widthVal"></span></label>
    <input type="range" id="widthRange" min="30" max="220" step="1">
    <label style="margin-top:8px;">회전 <span class="range-val" id="rotateVal"></span></label>
    <input type="range" id="rotateRange" min="-45" max="45" step="1">
  </div>
</div>

<!-- 배경 설정 패널 -->
<div class="img-panel" id="bgPanel">
  <div class="img-panel-head">
    <span>배경 설정</span>
    <button type="button" id="bgPanelClose" aria-label="닫기">✕</button>
  </div>
  <div class="img-panel-row">
    <label>배경 종류</label>
    <select id="bgTypeSelect">
      <option value="checker">체크무늬 (기본)</option>
      <option value="gradient">그라데이션</option>
      <option value="image">이미지</option>
    </select>
  </div>
  <div class="img-panel-row" id="bgCheckerRow">
    <label>무늬 색상</label>
    <input type="color" id="bgCheckerColorInput" value="#111111">
  </div>
  <div class="img-panel-row" id="bgGradientRow" hidden>
    <label>색상 1</label>
    <input type="color" id="bgGradientColor1Input" value="#111111">
    <label style="margin-top: 8px;">색상 2</label>
    <input type="color" id="bgGradientColor2Input" value="#4b5563">
  </div>
  <div class="img-panel-row" id="bgImageRow" hidden>
    <label>이미지 주소 (URL)</label>
    <input type="text" id="bgImageUrlInput" placeholder="https://...">
    <label style="margin-top: 8px;">또는 내 사진 올리기</label>
    <input type="file" id="bgImageFileInput" accept="image/*">
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
(function () {
  var CARD_KEY = 'ridercard:html:v1';
  var POINT_KEY = 'ridercard:point:v1';
  var BG_KEY = 'ridercard:bg:v1';

  var card = document.getElementById('card');
  var pointInput = document.getElementById('pointColorInput');
  var copyBtn = document.getElementById('copyBtn');
  var saveImageBtn = document.getElementById('saveImageBtn');
  var resetBtn = document.getElementById('resetBtn');
  var saveStatus = document.getElementById('saveStatus');

  var panel = document.getElementById('imgPanel');
  var panelTitle = document.getElementById('imgPanelTitle');
  var panelClose = document.getElementById('imgPanelClose');
  var urlInput = document.getElementById('imgUrlInput');
  var fileInput = document.getElementById('imgFileInput');
  var stickerControls = document.getElementById('stickerControls');
  var widthRange = document.getElementById('widthRange');
  var widthVal = document.getElementById('widthVal');
  var rotateRange = document.getElementById('rotateRange');
  var rotateVal = document.getElementById('rotateVal');

  var bgOpenBtn = document.getElementById('bgOpenBtn');
  var bgPanel = document.getElementById('bgPanel');
  var bgPanelClose = document.getElementById('bgPanelClose');
  var bgTypeSelect = document.getElementById('bgTypeSelect');
  var bgCheckerRow = document.getElementById('bgCheckerRow');
  var bgGradientRow = document.getElementById('bgGradientRow');
  var bgImageRow = document.getElementById('bgImageRow');
  var bgCheckerColorInput = document.getElementById('bgCheckerColorInput');
  var bgGradientColor1Input = document.getElementById('bgGradientColor1Input');
  var bgGradientColor2Input = document.getElementById('bgGradientColor2Input');
  var bgImageUrlInput = document.getElementById('bgImageUrlInput');
  var bgImageFileInput = document.getElementById('bgImageFileInput');

  var bgState = { type: 'checker', checkerColor: '#111111', gradient1: '#111111', gradient2: '#4b5563', image: '' };

  var activeImg = null;
  var BLANK_MAIN = 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHdpZHRoPSczMDAnIGhlaWdodD0nNDAwJz48cmVjdCB3aWR0aD0nMTAwJScgaGVpZ2h0PScxMDAlJyBmaWxsPScjZTVlN2ViJy8+PHRleHQgeD0nNTAlJyB5PSc0NiUnIGZvbnQtZmFtaWx5PSdzYW5zLXNlcmlmJyBmb250LXNpemU9JzQ4JyBmaWxsPScjYTNhM2EzJyB0ZXh0LWFuY2hvcj0nbWlkZGxlJz4rPC90ZXh0Pjx0ZXh0IHg9JzUwJScgeT0nNTglJyBmb250LWZhbWlseT0nc2Fucy1zZXJpZicgZm9udC1zaXplPScxNScgZmlsbD0nI2EzYTNhMycgdGV4dC1hbmNob3I9J21pZGRsZSc+7IKs7KeE7J2EIO2BtOumre2VtOyEnCDstpTqsIDtlZjshLjsmpQ8L3RleHQ+PC9zdmc+';
  var BLANK_STICKER = 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHdpZHRoPScxMjAnIGhlaWdodD0nMTIwJz48cmVjdCB3aWR0aD0nMTAwJScgaGVpZ2h0PScxMDAlJyByeD0nMTYnIGZpbGw9JyNlNWU3ZWInLz48dGV4dCB4PSc1MCUnIHk9JzYwJScgZm9udC1mYW1pbHk9J3NhbnMtc2VyaWYnIGZvbnQtc2l6ZT0nNDYnIGZpbGw9JyNhM2EzYTMnIHRleHQtYW5jaG9yPSdtaWRkbGUnPis8L3RleHQ+PC9zdmc+';

  /* ---------- 저장 / 복원 ---------- */
  var saveTimer = null;
  function flashSaved() {
    saveStatus.classList.add('show');
    clearTimeout(flashSaved._t);
    flashSaved._t = setTimeout(function () { saveStatus.classList.remove('show'); }, 900);
  }
  function saveCardNow() {
    try {
      localStorage.setItem(CARD_KEY, card.innerHTML);
      flashSaved();
    } catch (e) {}
  }
  function saveCard() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveCardNow, 350);
  }

  function restore() {
    try {
      var savedHtml = localStorage.getItem(CARD_KEY);
      if (savedHtml) card.innerHTML = savedHtml.replace(/ninecard/g, 'card');
      var savedPoint = localStorage.getItem(POINT_KEY);
      if (savedPoint) {
        document.documentElement.style.setProperty('--point-color', savedPoint);
        pointInput.value = savedPoint;
      }
      var savedBg = localStorage.getItem(BG_KEY);
      if (savedBg) {
        var parsed = JSON.parse(savedBg);
        for (var k in bgState) if (parsed[k] !== undefined) bgState[k] = parsed[k];
      }
    } catch (e) {}
  }

  /* ---------- 텍스트 편집 ---------- */
  function wireEditableText() {
    var nodes = card.querySelectorAll('[contenteditable="true"]');
    for (var i = 0; i < nodes.length; i++) {
      nodes[i].addEventListener('input', saveCard);
    }
  }

  /* ---------- 칸별 색상 지정 ---------- */
  function wireCellColorPickers() {
    var inputs = card.querySelectorAll('.cell-color-input');
    for (var i = 0; i < inputs.length; i++) {
      inputs[i].addEventListener('input', function (e) {
        var container = e.target.closest('.box, .card-section');
        if (!container) return;
        container.style.setProperty('--cell-color', e.target.value);
        saveCard();
      });
      // 라벨/칸 클릭 시 텍스트 편집 포커스로 이어지지 않도록 분리
      inputs[i].addEventListener('click', function (e) { e.stopPropagation(); });
    }
  }

  /* ---------- 포인트 색상 ---------- */
  pointInput.addEventListener('input', function () {
    document.documentElement.style.setProperty('--point-color', pointInput.value);
    try { localStorage.setItem(POINT_KEY, pointInput.value); } catch (e) {}
    flashSaved();
  });

  /* ---------- 배경 설정 ---------- */
  function applyBg() {
    card.setAttribute('data-bg-type', bgState.type);
    card.style.setProperty('--bg-color', bgState.checkerColor);
    card.style.setProperty('--bg-color-1', bgState.gradient1);
    card.style.setProperty('--bg-color-2', bgState.gradient2);
    card.style.setProperty('--bg-image', bgState.image ? "url('" + bgState.image.replace(/'/g, "\\'") + "')" : 'none');
  }

  function saveBgState() {
    try { localStorage.setItem(BG_KEY, JSON.stringify(bgState)); } catch (e) {}
    flashSaved();
  }

  function syncBgPanelInputs() {
    bgTypeSelect.value = bgState.type;
    bgCheckerRow.hidden = bgState.type !== 'checker';
    bgGradientRow.hidden = bgState.type !== 'gradient';
    bgImageRow.hidden = bgState.type !== 'image';
    bgCheckerColorInput.value = bgState.checkerColor;
    bgGradientColor1Input.value = bgState.gradient1;
    bgGradientColor2Input.value = bgState.gradient2;
    bgImageUrlInput.value = bgState.image;
  }

  function openBgPanel() {
    closePanel();
    syncBgPanelInputs();
    bgPanel.classList.add('open');
  }
  function closeBgPanel() { bgPanel.classList.remove('open'); }

  bgOpenBtn.addEventListener('click', openBgPanel);
  bgPanelClose.addEventListener('click', closeBgPanel);

  bgTypeSelect.addEventListener('change', function () {
    bgState.type = bgTypeSelect.value;
    syncBgPanelInputs();
    applyBg();
    saveBgState();
  });

  bgCheckerColorInput.addEventListener('input', function () {
    bgState.checkerColor = bgCheckerColorInput.value;
    applyBg();
    saveBgState();
  });

  bgGradientColor1Input.addEventListener('input', function () {
    bgState.gradient1 = bgGradientColor1Input.value;
    applyBg();
    saveBgState();
  });

  bgGradientColor2Input.addEventListener('input', function () {
    bgState.gradient2 = bgGradientColor2Input.value;
    applyBg();
    saveBgState();
  });

  bgImageUrlInput.addEventListener('input', function () {
    bgState.image = bgImageUrlInput.value.trim();
    applyBg();
    saveBgState();
  });

  bgImageFileInput.addEventListener('change', function () {
    if (!bgImageFileInput.files || !bgImageFileInput.files[0]) return;
    resizeImageFile(bgImageFileInput.files[0], 1200, function (dataUrl) {
      bgState.image = dataUrl;
      bgImageUrlInput.value = '';
      bgImageUrlInput.placeholder = '(업로드된 이미지 사용 중) 새 주소를 입력하면 교체됩니다';
      applyBg();
      saveBgState();
    });
  });

  /* ---------- 이미지 클릭 -> 편집 패널 ---------- */
  function fileToDataUrl(file, cb) {
    var reader = new FileReader();
    reader.onload = function () { cb(reader.result); };
    reader.readAsDataURL(file);
  }

  /* 큰 원본 사진을 그대로 넣으면 복사한 코드가 수십 MB로 불어나므로,
     실제 표시 크기에 맞춰 축소한 뒤 데이터로 저장한다. */
  function resizeImageFile(file, maxDim, cb) {
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () {
      var scale = Math.min(1, maxDim / Math.max(img.naturalWidth, img.naturalHeight));
      var w = Math.max(1, Math.round(img.naturalWidth * scale));
      var h = Math.max(1, Math.round(img.naturalHeight * scale));
      var canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);

      var hasAlpha = false;
      try {
        var data = ctx.getImageData(0, 0, w, h).data;
        for (var i = 3; i < data.length; i += 4) {
          if (data[i] < 200) { hasAlpha = true; break; }
        }
      } catch (e) {}

      cb(hasAlpha ? canvas.toDataURL('image/png') : canvas.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = function () {
      URL.revokeObjectURL(url);
      fileToDataUrl(file, cb);
    };
    img.src = url;
  }

  function openPanelFor(img) {
    closeBgPanel();
    activeImg = img;
    var isSticker = img.dataset.img === 'sticker';
    var src = img.getAttribute('src') || '';
    var isBlank = src === BLANK_MAIN || src === BLANK_STICKER;
    var isUploaded = !isBlank && src.indexOf('data:') === 0;
    panelTitle.textContent = isSticker ? '스티커 편집' : '메인 사진 편집';
    urlInput.value = (isBlank || isUploaded) ? '' : src;
    urlInput.placeholder = isUploaded
      ? '(업로드된 이미지 사용 중) 새 주소를 입력하면 교체됩니다'
      : 'https://...';
    fileInput.value = '';

    if (isSticker) {
      stickerControls.hidden = false;
      var w = parseFloat(img.style.width) || 90;
      var m = /rotate\((-?\d+(\.\d+)?)deg\)/.exec(img.style.transform || '');
      var r = m ? parseFloat(m[1]) : 0;
      widthRange.value = w;
      widthVal.textContent = Math.round(w) + 'px';
      rotateRange.value = r;
      rotateVal.textContent = Math.round(r) + '°';
    } else {
      stickerControls.hidden = true;
    }

    panel.classList.add('open');
  }

  function closePanel() {
    panel.classList.remove('open');
    activeImg = null;
  }

  panelClose.addEventListener('click', closePanel);

  urlInput.addEventListener('input', function () {
    if (!activeImg) return;
    var v = urlInput.value.trim();
    if (v) {
      activeImg.setAttribute('src', v);
      saveCard();
    }
  });

  fileInput.addEventListener('change', function () {
    if (!activeImg || !fileInput.files || !fileInput.files[0]) return;
    var maxDim = activeImg.dataset.img === 'sticker' ? 500 : 1000;
    resizeImageFile(fileInput.files[0], maxDim, function (dataUrl) {
      activeImg.setAttribute('src', dataUrl);
      urlInput.value = '';
      urlInput.placeholder = '(업로드된 이미지 사용 중) 새 주소를 입력하면 교체됩니다';
      saveCard();
    });
  });

  widthRange.addEventListener('input', function () {
    if (!activeImg) return;
    activeImg.style.width = widthRange.value + 'px';
    widthVal.textContent = widthRange.value + 'px';
    saveCard();
  });

  rotateRange.addEventListener('input', function () {
    if (!activeImg) return;
    activeImg.style.transform = 'rotate(' + rotateRange.value + 'deg)';
    rotateVal.textContent = rotateRange.value + '°';
    saveCard();
  });

  /* ---------- 스티커 드래그 ---------- */
  function wireImages() {
    var mainImgs = card.querySelectorAll('[data-img="main"]');
    for (var i = 0; i < mainImgs.length; i++) {
      mainImgs[i].addEventListener('click', function (e) { openPanelFor(e.currentTarget); });
    }

    var stickers = card.querySelectorAll('.card-sticker');
    for (var j = 0; j < stickers.length; j++) {
      wireStickerDrag(stickers[j]);
    }
  }

  function wireStickerDrag(img) {
    var dragging = false;
    var startX = 0, startY = 0;
    var start = { left: null, right: null, top: null, bottom: null };
    var moved = false;

    img.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      dragging = true;
      moved = false;
      startX = e.clientX;
      startY = e.clientY;
      start.left = img.style.left !== '' ? parseFloat(img.style.left) : null;
      start.right = img.style.right !== '' ? parseFloat(img.style.right) : null;
      start.top = img.style.top !== '' ? parseFloat(img.style.top) : null;
      start.bottom = img.style.bottom !== '' ? parseFloat(img.style.bottom) : null;
      img.classList.add('dragging');
      try { img.setPointerCapture(e.pointerId); } catch (err) {}
    });

    img.addEventListener('pointermove', function (e) {
      if (!dragging) return;
      var dx = e.clientX - startX;
      var dy = e.clientY - startY;
      if (Math.abs(dx) > 3 || Math.abs(dy) > 3) moved = true;
      if (start.left !== null) img.style.left = (start.left + dx) + 'px';
      if (start.right !== null) img.style.right = (start.right - dx) + 'px';
      if (start.top !== null) img.style.top = (start.top + dy) + 'px';
      if (start.bottom !== null) img.style.bottom = (start.bottom - dy) + 'px';
    });

    function endDrag(e) {
      if (!dragging) return;
      dragging = false;
      img.classList.remove('dragging');
      try { img.releasePointerCapture(e.pointerId); } catch (err) {}
      if (moved) {
        saveCard();
      } else {
        openPanelFor(img);
      }
    }

    img.addEventListener('pointerup', endDrag);
    img.addEventListener('pointercancel', endDrag);
  }

  /* ---------- 복사 / 초기화 ---------- */
  function buildExportHtml() {
    var pointVal = getComputedStyle(document.documentElement).getPropertyValue('--point-color').trim() || '#111111';
    var cardStyleText = document.getElementById('cardStyle').textContent;
    var clone = card.cloneNode(true);
    var editables = clone.querySelectorAll('[contenteditable]');
    for (var i = 0; i < editables.length; i++) editables[i].removeAttribute('contenteditable');
    var pickers = clone.querySelectorAll('.cell-color-picker');
    for (var p = 0; p < pickers.length; p++) pickers[p].remove();

    return '<div class="card-outer">\n' +
      '<style>\n' +
      '  * { box-sizing: border-box; }\n' +
      '  .card-outer { width: 100%; max-width: 420px; margin: 0 auto; }\n' +
      '  :root { --point-color: ' + pointVal + '; }\n' +
      cardStyleText +
      '\n</style>\n' +
      '<svg width="0" height="0" style="position: absolute; overflow: hidden;" aria-hidden="true">\n' +
      '  <defs>\n' +
      '    <filter id="stickerOutline" x="-30%" y="-30%" width="160%" height="160%">\n' +
      '      <feMorphology in="SourceAlpha" operator="dilate" radius="4" result="dilated"/>\n' +
      '      <feFlood flood-color="#ffffff" result="white"/>\n' +
      '      <feComposite in="white" in2="dilated" operator="in" result="outline"/>\n' +
      '      <feMerge>\n' +
      '        <feMergeNode in="outline"/>\n' +
      '        <feMergeNode in="SourceGraphic"/>\n' +
      '      </feMerge>\n' +
      '    </filter>\n' +
      '  </defs>\n' +
      '</svg>\n' +
      clone.outerHTML + '\n' +
      '</div>\n';
  }

  copyBtn.addEventListener('click', function () {
    window.focus();
    var html = buildExportHtml();
    var done = function (ok) {
      var original = copyBtn.textContent;
      copyBtn.textContent = ok === false ? '복사 실패 (직접 선택해 복사해주세요)' : '복사됨!';
      setTimeout(function () { copyBtn.textContent = original; }, 1800);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(html).then(function () { done(true); }, function () { fallbackCopy(html, done); });
    } else {
      fallbackCopy(html, done);
    }
  });

  function fallbackCopy(text, done) {
    var scratch = document.createElement('textarea');
    scratch.value = text;
    scratch.style.position = 'fixed';
    scratch.style.opacity = '0';
    document.body.appendChild(scratch);
    scratch.focus();
    scratch.select();
    scratch.setSelectionRange(0, text.length);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(scratch);
    done(ok);
  }

  function safeFileName() {
    var nameEl = card.querySelector('.card-namebox .name');
    var raw = (nameEl ? nameEl.textContent : '').trim() || 'rider-card';
    var cleaned = raw.replace(/\s+/g, '_').replace(/[^\w\-가-힣]/g, '');
    return (cleaned || 'rider-card') + '.png';
  }

  saveImageBtn.addEventListener('click', function () {
    if (typeof html2canvas === 'undefined') {
      alert('이미지 저장 기능을 불러오지 못했어요. 인터넷 연결을 확인한 뒤 새로고침 후 다시 시도해 주세요.');
      return;
    }

    var original = saveImageBtn.textContent;
    saveImageBtn.disabled = true;
    saveImageBtn.textContent = '저장 중...';

    html2canvas(card, { backgroundColor: null, scale: 2, useCORS: true })
      .then(function (canvas) {
        canvas.toBlob(function (blob) {
          if (!blob) throw new Error('이미지 생성 실패');
          var url = URL.createObjectURL(blob);
          var a = document.createElement('a');
          a.href = url;
          a.download = safeFileName();
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
        }, 'image/png');
      })
      .catch(function (err) {
        alert('이미지 저장에 실패했어요: ' + err.message + '\n(외부 이미지 주소 대신 "내 사진 올리기"로 넣은 사진은 항상 정상적으로 저장돼요.)');
      })
      .finally(function () {
        saveImageBtn.disabled = false;
        saveImageBtn.textContent = original;
      });
  });

  resetBtn.addEventListener('click', function () {
    if (!confirm('모든 수정 내용을 처음 상태로 되돌릴까요? 저장된 내용은 사라집니다.')) return;
    try {
      localStorage.removeItem(CARD_KEY);
      localStorage.removeItem(POINT_KEY);
      localStorage.removeItem(BG_KEY);
    } catch (e) {}
    location.reload();
  });

  /* ---------- 초기화 ---------- */
  restore();
  wireEditableText();
  wireImages();
  wireCellColorPickers();
  applyBg();
})();
</script>
</body>
</html>
